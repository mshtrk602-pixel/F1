name: Auto Video Republisher

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'رابط الفيديو (Video URL)'
        required: true
      video_title:
        description: 'عنوان الفيديو (Video Title)'
        required: true

jobs:
  process-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install yt-dlp google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run Process Script
        env:
          YOUTUBE_CLIENT_EMAIL: ${{ secrets.YOUTUBE_CLIENT_EMAIL }}
          YOUTUBE_PRIVATE_KEY: ${{ secrets.YOUTUBE_PRIVATE_KEY }}
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          VIDEO_TITLE: ${{ github.event.inputs.video_title }}
        run: python process.py
