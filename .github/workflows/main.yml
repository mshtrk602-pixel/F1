name: Auto Video Republisher

on:
  workflow_dispatch:
  # (أو أي أوقات جدولة أخرى لديك)

jobs:
  process-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install yt-dlp google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run Process Script
        env:
          YOUTUBE_CLIENT_EMAIL: ${{ secrets.YOUTUBE_CLIENT_EMAIL }}
          YOUTUBE_PRIVATE_KEY: ${{ secrets.YOUTUBE_PRIVATE_KEY }}
        run: python process.py
