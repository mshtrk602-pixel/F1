name: Auto Video Republisher

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'رابط الفيديو'
        required: true
      title:
        description: 'عنوان الفيديو'
        required: false
        default: 'فيديو جديد'

jobs:
  process-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run Process Script
        env:
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          VIDEO_TITLE: ${{ github.event.inputs.title }}
        run: python process.py

